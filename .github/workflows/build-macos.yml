name: Build kext and app (macOS Tahoe)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Intel x86_64 - kext and app
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      RTW_SIGN_IDENTITY: '-'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the Intel runner and Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "x86_64" ]]; then
            echo 'This project requires an Intel x86_64 macOS runner.' >&2
            exit 1
          fi
          xcode-select -p
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: ${sdk_version}"
          if [[ "${sdk_version}" != 26.* ]]; then
            echo 'The project requires the macOS 26 SDK from Xcode 26.' >&2
            exit 1
          fi
          xcrun --find clang++
          xcrun --find swift
          /usr/bin/python3 --version
          git --version
          for tool in ditto iconutil lipo plutil codesign; do
            command -v "${tool}" >/dev/null
          done

      - name: Verify committed source checksums
        shell: bash
        run: shasum -a 256 -c SOURCE-MANIFEST.sha256

      - name: Compile and sign the x86_64 kernel extension
        id: kext
        shell: bash
        run: bash ./build.command --kext

      - name: Compile and sign the x86_64 menu-bar app
        id: app
        if: ${{ !cancelled() }}
        shell: bash
        run: bash ./build.command --app

      - name: Confirm the generated Xcode project matches the repository
        if: ${{ !cancelled() }}
        shell: bash
        run: git diff --exit-code -- TahoeRealtekWiFi.xcodeproj/project.pbxproj

      - name: Archive validated bundles without losing macOS permissions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "Release/TahoeRealtekWiFi.kext" ]]; then
            test -s "Release/TahoeRealtekWiFi.kext/Contents/MacOS/TahoeRealtekWiFi"
            codesign --verify --strict "Release/TahoeRealtekWiFi.kext"
            ditto -c -k --sequesterRsrc --keepParent \
              "Release/TahoeRealtekWiFi.kext" \
              "${RUNNER_TEMP}/TahoeRealtekWiFi.kext.zip"
          fi
          if [[ -d "Release/Tahoe Wi-Fi USB.app" ]]; then
            test -s "Release/Tahoe Wi-Fi USB.app/Contents/MacOS/TahoeUSBWiFi"
            test -s "Release/Tahoe Wi-Fi USB.app/Contents/Helpers/TahoeWiFiHelper"
            codesign --verify --deep --strict "Release/Tahoe Wi-Fi USB.app"
            ditto -c -k --sequesterRsrc --keepParent \
              "Release/Tahoe Wi-Fi USB.app" \
              "${RUNNER_TEMP}/Tahoe-Wi-Fi-USB.app.zip"
          fi

      - name: Upload kernel extension
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: TahoeRealtekWiFi-kext-x86_64
          path: ${{ runner.temp }}/TahoeRealtekWiFi.kext.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload menu-bar app
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Tahoe-Wi-Fi-USB-app-x86_64
          path: ${{ runner.temp }}/Tahoe-Wi-Fi-USB.app.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: |
            Release/build-kext.log
            Release/build-app.log
          if-no-files-found: warn
          retention-days: 14
  publish-release:
    name: Publish tagged development pre-release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify release tag matches the source versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          import plistlib

          with open('kext/Info.plist', 'rb') as f:
              kext = plistlib.load(f)
          with open('app/Info.plist', 'rb') as f:
              app = plistlib.load(f)

          driver_version = str(kext['CFBundleShortVersionString'])
          driver_build = str(kext['CFBundleVersion'])
          app_version = str(app['CFBundleShortVersionString'])
          app_build = str(app['CFBundleVersion'])
          expected_tag = f'v{driver_version}-build{driver_build}-app{app_build}'
          actual_tag = os.environ['GITHUB_REF_NAME']
          if actual_tag != expected_tag:
              raise SystemExit(f'Release tag mismatch: expected {expected_tag}, got {actual_tag}')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              print(f'KEXT_VERSION={driver_version}', file=env)
              print(f'KEXT_BUILD={driver_build}', file=env)
              print(f'APP_VERSION={app_version}', file=env)
              print(f'APP_BUILD={app_build}', file=env)
          print(f'Tag verified: {actual_tag} (kext {driver_version}/{driver_build}, app {app_version}/{app_build})')
          PYTHON

      - name: Download the compiled kernel extension
        uses: actions/download-artifact@v4
        with:
          name: TahoeRealtekWiFi-kext-x86_64
          path: release-assets

      - name: Download the compiled menu-bar app
        uses: actions/download-artifact@v4
        with:
          name: Tahoe-Wi-Fi-USB-app-x86_64
          path: release-assets

      - name: Validate release archives and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for archive in TahoeRealtekWiFi.kext.zip Tahoe-Wi-Fi-USB.app.zip; do
            test -s "$archive"
            unzip -tqq "$archive"
          done
          unzip -Z -1 TahoeRealtekWiFi.kext.zip | grep -F 'TahoeRealtekWiFi.kext/Contents/Info.plist' > /dev/null
          unzip -Z -1 Tahoe-Wi-Fi-USB.app.zip | grep -F 'Tahoe Wi-Fi USB.app/Contents/Info.plist' > /dev/null
          sha256sum TahoeRealtekWiFi.kext.zip Tahoe-Wi-Fi-USB.app.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish development pre-release without overwriting existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release '$tag' already exists; refusing to replace previously published assets."
            exit 1
          fi
          cat > release-notes.md <<EOF
          Experimental Realtek USB Wi-Fi support for **macOS Tahoe on Intel Macs (x86_64)**.

          - **Driver:** ${KEXT_VERSION}, build ${KEXT_BUILD}
          - **Menu-bar application:** ${APP_VERSION}, build ${APP_BUILD}
          - **Hardware reported as tested by the maintainer:** TP-Link Archer T9UH and TP-Link TL-WN822N (board revisions and complete test coverage are not yet documented).

          ### Downloads
          - TahoeRealtekWiFi.kext.zip: ad-hoc-signed kernel extension (EFI/bootloader installation is separate).
          - Tahoe-Wi-Fi-USB.app.zip: ad-hoc-signed menu-bar app and helper.
          - SHA256SUMS.txt: SHA-256 checksums of both downloads.

          **Development preview:** the CI build confirms compilation and basic bundle verification, not successful operation on every adapter or macOS configuration. No blanket hardware certification is implied. See the README for installation guidance, limitations, and how to contribute hardware testing.
          EOF
          gh release create "$tag" \
            release-assets/TahoeRealtekWiFi.kext.zip \
            release-assets/Tahoe-Wi-Fi-USB.app.zip \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --prerelease \
            --title "Tahoe Wi-Fi USB — Realtek USB Wi-Fi for macOS Tahoe ($tag)" \
            --notes-file release-notes.md
